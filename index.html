<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA benzeri offline kısayol davranışı için meta etiketleri -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Çizim Oyunu Asistanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
            touch-action: none; /* Pull-to-refresh'i engeller */
        }
        ::-webkit-scrollbar {
            display: none;
        }
        .blur-text {
            filter: blur(8px);
            user-select: none;
            opacity: 0.5;
        }
        .timer-pulse {
            animation: pulse-red 1s infinite;
        }
        @keyframes pulse-red {
            0%, 100% { color: #ef4444; text-shadow: 0 0 15px rgba(239,68,68,0.5); transform: scale(1); }
            50% { color: #f87171; text-shadow: 0 0 25px rgba(239,68,68,0.8); transform: scale(1.05); }
        }
        /* Modal açıkken arka plan kaymasını engellemek için */
        .modal-open {
            overflow: hidden !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-900 text-slate-100 flex flex-col selection:bg-indigo-500 relative">

    <!-- HEADER: Dil, Ayarlar, Mod ve Süre Seçimi -->
    <header class="h-auto p-2 sm:p-3 bg-slate-800 shadow-lg flex flex-wrap justify-center sm:justify-between items-center gap-2 z-10">
        
        <!-- Language & Settings -->
        <div class="flex items-center bg-slate-700 rounded-lg p-1">
            <button id="lang-tr" class="px-2 py-1.5 sm:px-3 rounded-md text-sm font-semibold bg-indigo-600 text-white transition-colors" onclick="setLanguage('tr')">TR</button>
            <button id="lang-en" class="px-2 py-1.5 sm:px-3 rounded-md text-sm font-semibold text-slate-300 hover:text-white transition-colors" onclick="setLanguage('en')">EN</button>
            <div class="w-px h-6 bg-slate-600 mx-1"></div>
            <!-- Ayarlar (Çark) İkonu -->
            <button onclick="openSettings()" class="p-1.5 rounded-md text-slate-300 hover:text-white hover:bg-slate-600 transition-colors" title="Kelimeleri Düzenle">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>

        <!-- Mode Selection -->
        <div class="flex items-center bg-slate-700 rounded-lg p-1 w-full sm:w-auto justify-center">
            <button id="mode-classic" class="px-3 py-1.5 rounded-md text-sm font-semibold bg-purple-500 text-white transition-colors flex-1" onclick="setMode('classic')">Klasik</button>
            <button id="mode-double" class="px-3 py-1.5 rounded-md text-sm font-semibold text-slate-300 hover:text-white transition-colors flex-1" onclick="setMode('double')">2'li</button>
            <button id="mode-triple" class="px-3 py-1.5 rounded-md text-sm font-semibold text-slate-300 hover:text-white transition-colors flex-1" onclick="setMode('triple')">3'lü</button>
        </div>

        <!-- Difficulty Selection -->
        <div id="diffContainer" class="flex items-center bg-slate-700 rounded-lg p-1 w-full sm:w-auto justify-center transition-all">
            <button id="diff-easy" class="px-3 py-1.5 rounded-md text-sm font-semibold bg-emerald-500 text-white transition-colors flex-1" onclick="setDifficulty('easy')">Kolay</button>
            <button id="diff-medium" class="px-3 py-1.5 rounded-md text-sm font-semibold text-slate-300 hover:text-white transition-colors flex-1" onclick="setDifficulty('medium')">Orta</button>
            <button id="diff-hard" class="px-3 py-1.5 rounded-md text-sm font-semibold text-slate-300 hover:text-white transition-colors flex-1" onclick="setDifficulty('hard')">Zor</button>
        </div>

        <!-- Timer Options -->
        <div class="flex items-center bg-slate-700 rounded-lg p-1">
            <button id="time-30" class="px-2 py-1.5 sm:px-3 rounded-md text-sm font-semibold text-slate-300 hover:text-white transition-colors" onclick="setTimerDuration(30)">30s</button>
            <button id="time-60" class="px-2 py-1.5 sm:px-3 rounded-md text-sm font-semibold bg-blue-500 text-white transition-colors" onclick="setTimerDuration(60)">60s</button>
            <button id="time-90" class="px-2 py-1.5 sm:px-3 rounded-md text-sm font-semibold text-slate-300 hover:text-white transition-colors" onclick="setTimerDuration(90)">90s</button>
        </div>
    </header>

    <!-- MAIN CONTENT: Ekrana tam sığması için padding ve gap değerleri düşürüldü -->
    <main class="flex-1 flex flex-col items-center justify-center p-2 sm:p-4 gap-3 sm:gap-4 relative w-full h-full max-h-full">
        
        <!-- Word Card (Boyutu biraz küçültüldü) -->
        <div class="bg-slate-800 rounded-3xl shadow-2xl p-4 sm:p-6 w-full max-w-3xl flex flex-col items-center justify-center relative min-h-[160px] sm:min-h-[180px] border border-slate-700 transition-transform duration-200">
            
            <div id="wordContainer" class="w-full flex items-center justify-center mb-2 sm:mb-4 min-h-[60px]">
                <h2 class="text-4xl sm:text-5xl font-extrabold text-center text-white transition-all duration-300 tracking-tight break-words px-2 blur-text">
                    Gizli Kelime
                </h2>
            </div>
            
            <div class="mt-auto w-full flex justify-center">
                <button id="toggleBtn" onclick="toggleWord()" class="px-5 py-2.5 rounded-full bg-slate-600 hover:bg-slate-500 text-white font-semibold flex items-center justify-center gap-2 transition-transform active:scale-95 shadow-md text-sm sm:text-base">
                    <!-- Eye Icon -->
                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                        <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                    </svg>
                    <span id="toggleText">Kelimeyi Göster</span>
                </button>
            </div>
        </div>

        <!-- Sıradaki Kelime Butonu (Kutunun hemen altına alındı) -->
        <button onclick="nextWord()" class="w-full max-w-sm px-5 py-3 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold flex items-center justify-center gap-2 transition-transform active:scale-95 shadow-lg shadow-indigo-500/30 z-10 text-sm sm:text-base">
            <span id="nextBtnText">Sıradaki Kelime</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
        </button>

        <!-- Timer Display & Controls (Ekranın altından kesilmemesi için margin ayarlandı) -->
        <div class="flex flex-col items-center mt-2 sm:mt-4">
            <!-- Circular Modern Timer -->
            <div class="relative flex items-center justify-center w-32 h-32 sm:w-40 sm:h-40">
                <svg class="transform -rotate-90 w-full h-full drop-shadow-lg" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="6" fill="transparent" class="text-slate-700" />
                    <circle id="timerProgress" cx="50" cy="50" r="45" stroke="currentColor" stroke-width="6" fill="transparent" stroke-linecap="round" class="text-indigo-500 transition-all duration-1000 ease-linear" stroke-dasharray="283" stroke-dashoffset="0" />
                </svg>
                <div id="timerDisplay" class="absolute text-2xl sm:text-3xl font-mono font-bold text-slate-100">
                    01:00
                </div>
            </div>
            
            <div class="flex gap-4 mt-4">

                <button id="playPauseBtn" onclick="toggleTimer()" class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-emerald-500 hover:bg-emerald-400 flex items-center justify-center text-white shadow-lg active:scale-90 transition-transform">

                    <svg id="pauseIcon" class="hidden h-6 w-6 sm:h-7 sm:w-7" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>

                <button onclick="resetTimer()" class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-red-500 hover:bg-red-400 flex items-center justify-center text-white shadow-lg active:scale-90 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 sm:h-7 sm:w-7" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" /></svg>

        </div>

        // KELİME YÖNETİMİ & LOCALSTORAGE
        let appWords = {};
        
        function initWords() {
            const saved = localStorage.getItem('drawingGameWords');
            if (saved) {
                try {
                    appWords = JSON.parse(saved);
                } catch(e) {
                    appWords = JSON.parse(JSON.stringify(defaultWordsData));
                }
            } else {
                appWords = JSON.parse(JSON.stringify(defaultWordsData));
                localStorage.setItem('drawingGameWords', JSON.stringify(appWords));
            }
        }
        initWords();

        // UYGULAMA DURUMU (STATE)
        const state = {
            lang: 'tr',
            mode: 'classic',
            diff: 'easy',
            timerDuration: 60,
            timeLeft: 60,
            timerId: null,
            isPlaying: false,
            currentWords: [],
            isWordHidden: true
        };

        // ARAYÜZ METİNLERİ
        const uiTexts = {
            tr: {
                easy: 'Kolay', medium: 'Orta', hard: 'Zor',
                classic: 'Klasik', double: "2'li", triple: "3'lü",
                next: 'Sıradaki Kelime',
                show: 'Kelimeyi Göster', hide: 'Gizle',
                hiddenWord: 'Gizli Kelime', hiddenWords: 'Gizli Kelimeler',
                points: 'Puan'
            },
            en: {
                easy: 'Easy', medium: 'Medium', hard: 'Hard',
                classic: 'Classic', double: '2 Words', triple: '3 Words',
                next: 'Next Word',
                show: 'Show', hide: 'Hide',
                hiddenWord: 'Hidden Word', hiddenWords: 'Hidden Words',
                points: 'Pts'
            }
        };

        // DOM Elementleri
        const wordContainer = document.getElementById('wordContainer');
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleText = document.getElementById('toggleText');
        const timerDisplay = document.getElementById('timerDisplay');
        const nextBtnText = document.getElementById('nextBtnText');
        const diffContainer = document.getElementById('diffContainer');
        
        const langTr = document.getElementById('lang-tr');
        const langEn = document.getElementById('lang-en');
        const modeClassic = document.getElementById('mode-classic');
        const modeDouble = document.getElementById('mode-double');
        const modeTriple = document.getElementById('mode-triple');
        const diffEasy = document.getElementById('diff-easy');
        const diffMedium = document.getElementById('diff-medium');
        const diffHard = document.getElementById('diff-hard');
        const time30 = document.getElementById('time-30');
        const time60 = document.getElementById('time-60');
        const time90 = document.getElementById('time-90');

        function updateUINames() {
            const texts = uiTexts[state.lang];
            
            modeClassic.innerText = texts.classic;
            modeDouble.innerText = texts.double;
            modeTriple.innerText = texts.triple;
            
            diffEasy.innerText = texts.easy;
            diffMedium.innerText = texts.medium;
            diffHard.innerText = texts.hard;
            nextBtnText.innerText = texts.next;
            
            renderWordContainer();
        }

        function setLanguage(lang) {
            state.lang = lang;
            
            if (lang === 'tr') {
                langTr.className = "px-2 py-1.5 sm:px-3 rounded-md text-sm font-semibold bg-indigo-600 text-white transition-colors";
                langEn.className = "px-2 py-1.5 sm:px-3 rounded-md text-sm font-semibold text-slate-300 hover:text-white transition-colors";
            } else {
                langEn.className = "px-2 py-1.5 sm:px-3 rounded-md text-sm font-semibold bg-indigo-600 text-white transition-colors";
                langTr.className = "px-2 py-1.5 sm:px-3 rounded-md text-sm font-semibold text-slate-300 hover:text-white transition-colors";
            }
            
            updateUINames();
            nextWord();
        }

        function setDifficulty(diff) {
            state.diff = diff;
            const activeClass = "px-3 py-1.5 rounded-md text-sm font-semibold text-white transition-colors flex-1 ";
            const inactiveClass = "px-3 py-1.5 rounded-md text-sm font-semibold text-slate-300 hover:text-white transition-colors flex-1";
            
            diffEasy.className = inactiveClass;
            diffMedium.className = inactiveClass;
            diffHard.className = inactiveClass;

            if (diff === 'easy') diffEasy.className = activeClass + "bg-emerald-500";
            if (diff === 'medium') diffMedium.className = activeClass + "bg-amber-500";
            if (diff === 'hard') diffHard.className = activeClass + "bg-red-500";

            nextWord();
        }

        function setMode(mode) {
            state.mode = mode;
            const activeClass = "px-3 py-1.5 rounded-md text-sm font-semibold text-white transition-colors flex-1 bg-purple-500";
            const inactiveClass = "px-3 py-1.5 rounded-md text-sm font-semibold text-slate-300 hover:text-white transition-colors flex-1";
            
            modeClassic.className = inactiveClass;
            modeDouble.className = inactiveClass;
            modeTriple.className = inactiveClass;

            if (mode === 'classic') modeClassic.className = activeClass;
            if (mode === 'double') modeDouble.className = activeClass;
            if (mode === 'triple') modeTriple.className = activeClass;

            // Klasik mod değilse Zorluk seçimini gizle
            if (mode === 'classic') {
                diffContainer.classList.remove('hidden');
                diffContainer.classList.add('flex');
            } else {
                diffContainer.classList.add('hidden');
                diffContainer.classList.remove('flex');
            }

            nextWord();
        }

        function setTimerDuration(seconds) {
            state.timerDuration = seconds;
            
            const activeClass = "px-2 py-1.5 sm:px-3 rounded-md text-sm font-semibold bg-blue-500 text-white transition-colors";
            const inactiveClass = "px-2 py-1.5 sm:px-3 rounded-md text-sm font-semibold text-slate-300 hover:text-white transition-colors";
            
            time30.className = inactiveClass;
            time60.className = inactiveClass;
            time90.className = inactiveClass;

            if (seconds === 30) time30.className = activeClass;
            if (seconds === 60) time60.className = activeClass;
            if (seconds === 90) time90.className = activeClass;

            resetTimer();
        }

        function getRandomWord(difficultyParam) {
            // difficultyParam ile çağrılırsa onu, yoksa state.diff kullanır
            const diff = difficultyParam || state.diff;
            let rawString = appWords[state.lang][diff];
            if (!rawString || rawString.trim() === "") {
                return "Kelime Listesi Boş!";
            }
            const list = rawString.split(',').map(w => w.trim()).filter(w => w !== "");
            const randomIndex = Math.floor(Math.random() * list.length);
            return list[randomIndex] || "Hata";
        }

        function renderWordContainer() {
            const texts = uiTexts[state.lang];
            
            if (state.isWordHidden) {
                toggleText.innerText = texts.show;
                toggleBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                        <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                    </svg>
                    <span>${texts.show}</span>
                `;
                
                const hiddenTitle = state.mode === 'classic' ? texts.hiddenWord : texts.hiddenWords;
                wordContainer.innerHTML = `<h2 class="text-4xl sm:text-5xl font-extrabold text-center text-white transition-all duration-300 tracking-tight break-words px-2 blur-text">${hiddenTitle}</h2>`;
            } else {
                toggleText.innerText = texts.hide;
                toggleBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd" />
                        <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" />
                    </svg>
                    <span>${texts.hide}</span>
                `;
                
                if (state.mode === 'classic') {
                    const color = state.diff === 'easy' ? 'text-emerald-400' : (state.diff === 'medium' ? 'text-amber-400' : 'text-red-400');
                    wordContainer.innerHTML = `<h2 class="text-4xl sm:text-5xl font-extrabold text-center ${color} transition-all duration-300 tracking-tight break-words px-2">${state.currentWords[0].text}</h2>`;
                } else {
                    let html = '<div class="flex flex-col sm:flex-row gap-6 sm:gap-4 w-full justify-center items-center divide-y sm:divide-y-0 sm:divide-x divide-slate-600/50 py-2">';
                    state.currentWords.forEach(w => {
                        let colorClass = "text-white";
                        if (w.diff === 'easy') colorClass = "text-emerald-400";
                        if (w.diff === 'medium') colorClass = "text-amber-400";
                        if (w.diff === 'hard') colorClass = "text-red-400";

                        html += `
                        <div class="flex flex-col items-center sm:px-6 w-full pt-4 sm:pt-0 first:pt-0">
                            <span class="text-3xl sm:text-4xl font-bold ${colorClass} text-center break-words">${w.text}</span>
                            <span class="text-[11px] sm:text-xs text-slate-400 mt-1 sm:mt-2 font-medium tracking-widest uppercase bg-slate-900/50 px-2 py-1 rounded-md border border-slate-700/50">${w.points} ${texts.points}</span>
                        </div>`;
                    });
                    html += '</div>';
                    wordContainer.innerHTML = html;
                }
            }
        }

        function toggleWord() {
            state.isWordHidden = !state.isWordHidden;
            renderWordContainer();
        }

        function nextWord() {
            if (state.mode === 'classic') {
                state.currentWords = [{ text: getRandomWord(state.diff), points: null, diff: state.diff }];
            } else if (state.mode === 'double') {
                state.currentWords = [
                    { text: getRandomWord('easy'), points: 1, diff: 'easy' },
                    { text: getRandomWord('medium'), points: 2, diff: 'medium' }
                ];
            } else if (state.mode === 'triple') {
                state.currentWords = [
                    { text: getRandomWord('easy'), points: 1, diff: 'easy' },
                    { text: getRandomWord('medium'), points: 2, diff: 'medium' },
                    { text: getRandomWord('hard'), points: 3, diff: 'hard' }
                ];
            }

            state.isWordHidden = true;
            resetTimer(); 
            
            renderWordContainer();
            
            wordContainer.parentElement.classList.remove('scale-95');
            void wordContainer.parentElement.offsetWidth;
            wordContainer.parentElement.classList.add('scale-100');
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimerUI() {
            timerDisplay.innerText = formatTime(state.timeLeft);
            
            const circle = document.getElementById('timerProgress');
            const circumference = 283; 
            const progress = state.timeLeft / state.timerDuration;
            const offset = circumference - (progress * circumference);
            circle.style.strokeDashoffset = offset;
            
            if (state.timeLeft <= 10 && state.timeLeft > 0) {
                timerDisplay.classList.add('timer-pulse');
                circle.classList.remove('text-indigo-500');
                circle.classList.add('text-red-500');
            } else if (state.timeLeft === 0) {
                timerDisplay.classList.remove('timer-pulse');
                circle.classList.remove('text-indigo-500');
                circle.classList.add('text-red-500');
            } else {
                timerDisplay.classList.remove('timer-pulse');
                circle.classList.remove('text-red-500');
                circle.classList.add('text-indigo-500');
            }
        }

        function toggleTimer() {
            if (state.isPlaying) {
                clearInterval(state.timerId);
                state.isPlaying = false;
                updatePlayPauseUI();
            } else {
                if (state.timeLeft === 0) return;
                state.isPlaying = true;
                updatePlayPauseUI();
                state.timerId = setInterval(() => {
                    state.timeLeft--;
                    updateTimerUI();
                    
                    if (state.timeLeft <= 0) {
                        clearInterval(state.timerId);
                        state.isPlaying = false;
                        state.timeLeft = 0;
                        updateTimerUI();
                        updatePlayPauseUI();
                    }
                }, 1000);
            }
        }

        function updatePlayPauseUI() {
            const btn = document.getElementById('playPauseBtn');
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            
            if (state.isPlaying) {
                btn.classList.remove('bg-emerald-500', 'hover:bg-emerald-400');
                btn.classList.add('bg-amber-500', 'hover:bg-amber-400');
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                btn.classList.remove('bg-amber-500', 'hover:bg-amber-400');
                btn.classList.add('bg-emerald-500', 'hover:bg-emerald-400');
                pauseIcon.classList.add('hidden');
                playIcon.classList.remove('hidden');
            }
        }

        function resetTimer() {
            clearInterval(state.timerId);
            state.isPlaying = false;
            state.timeLeft = state.timerDuration;
            updateTimerUI();
            updatePlayPauseUI();
        }

        // SETTINGS (AYARLAR) YÖNETİMİ
        const settingsModal = document.getElementById('settingsModal');
        const editLang = document.getElementById('editLang');
        const editDiff = document.getElementById('editDiff');
        const wordsEditor = document.getElementById('wordsEditor');

        function openSettings() {
            settingsModal.classList.remove('hidden');
            document.body.classList.add('modal-open');
            // Mevcut durumu ayarlara yansıt
            editLang.value = state.lang;
            editDiff.value = state.diff;
            loadWordsToEditor();
        }

        function closeSettings() {
            settingsModal.classList.add('hidden');
            document.body.classList.remove('modal-open');
        }

        function loadWordsToEditor() {
            const l = editLang.value;
            const d = editDiff.value;
            wordsEditor.value = appWords[l][d];
        }

        function saveSettings() {
            const l = editLang.value;
            const d = editDiff.value;
            
            // Metin kutusundaki veriyi temizleyip kaydet
            const rawText = wordsEditor.value;
            const cleanedText = rawText.split(',')
                                       .map(w => w.trim())
                                       .filter(w => w !== "")
                                       .join(',');
            
            appWords[l][d] = cleanedText;
            
            // LocalStorage'a yaz
            localStorage.setItem('drawingGameWords', JSON.stringify(appWords));
            
            // Eğer değiştirilen ayarlar, kullanıcının o an oynadığı ayarlarla aynıysa kelimeyi yenile
            if (state.lang === l && state.diff === d) {
                nextWord();
            }
            
            closeSettings();
        }

        function resetToDefaults() {
            if(confirm("Tüm kelime listeleri orijinal haline dönecek. Emin misiniz?")) {
                appWords = JSON.parse(JSON.stringify(defaultWordsData));
                localStorage.setItem('drawingGameWords', JSON.stringify(appWords));
                loadWordsToEditor();
                nextWord();
            }
        }

        // İLK YÜKLEME
        window.onload = () => {
            setLanguage('tr'); 
            setTimerDuration(60); 
        };

    </script>
</body>
</html>
